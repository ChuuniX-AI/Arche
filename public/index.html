<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ad Guy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #000; --panel: #0b0c0f; --raise: #15171c; --line: #1f2129;
  --ink: #eceef3; --dim: #8b91a0; --blue: #3d6bff; --amber: #ffb547; --grey: #5b606c;
  --display: 'Bricolage Grotesque', system-ui, sans-serif; --ui: 'Geist', system-ui, sans-serif;
}
* { box-sizing: border-box; margin: 0; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font: 400 14px/1.5 var(--ui); -webkit-font-smoothing: antialiased; overflow-x: hidden; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; border-radius: 8px; }
[hidden] { display: none !important; }

/* Command bar */
.bar { position: sticky; top: 0; z-index: 5; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 16px; padding: 14px 24px; background: rgba(0,0,0,.8); backdrop-filter: blur(12px); }
.brand { font: 800 19px/1 var(--display); letter-spacing: -.02em; justify-self: start; }
.cmd { display: flex; align-items: center; background: var(--raise); border-radius: 999px; padding: 5px; box-shadow: 0 0 0 1px var(--line); width: min(620px, 100%); }
.cmd input { flex: 1; min-width: 0; background: none; border: 0; padding: 8px 16px; font-size: 15px; }
.cmd input:focus { outline: none; }
.cmd input::placeholder { color: var(--dim); }
.cmd select { width: 9.5em; background: none; border: 0; border-left: 1px solid var(--line); padding: 8px 28px 8px 14px; color: var(--ink); appearance: none; cursor: pointer;
  background-image: linear-gradient(45deg, transparent 50%, var(--dim) 50%), linear-gradient(135deg, var(--dim) 50%, transparent 50%);
  background-position: right 14px center, right 9px center; background-size: 5px 5px; background-repeat: no-repeat; }
.cmd select option { background: var(--raise); }
.primary { background: var(--ink); color: #000; font-weight: 600; padding: 9px 20px; border-radius: 999px; white-space: nowrap; transition: transform .15s; }
.primary:hover { transform: scale(1.03); }
.primary:disabled { opacity: .5; cursor: default; transform: none; }
.quiet { color: var(--dim); font-weight: 500; padding: 8px 4px; justify-self: end; white-space: nowrap; }
.quiet:hover { color: var(--ink); }

main { padding: 12px 24px 40px; }

/* Scout view */
#scout { max-width: 1040px; margin: 0 auto; }
.note { font: 500 clamp(20px, 2.4vw, 28px)/1.25 var(--display); letter-spacing: -.015em; min-height: 2.5em; display: flex; align-items: end; max-width: 34ch; }
.window { margin-top: 18px; border-radius: 14px; overflow: hidden; background: var(--panel); box-shadow: 0 0 0 1px var(--line); width: min(100%, 62vh * 1.6 + 0px); }
.chrome { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-bottom: 1px solid var(--line); }
.lights { display: flex; gap: 6px; } .lights i { width: 10px; height: 10px; border-radius: 50%; background: var(--line); }
.addr { flex: 1; background: var(--raise); border-radius: 999px; padding: 4px 14px; color: var(--dim); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.view { position: relative; aspect-ratio: 16 / 10; background: #000; }
.view canvas, .view img { position: absolute; inset: 0; width: 100%; height: 100%; }
.view img { object-fit: cover; object-position: top; opacity: 0; transition: opacity .7s; }
.view img.on { opacity: 1; }
.pct { position: absolute; right: 14px; bottom: 14px; background: var(--raise); color: var(--blue); font-weight: 500; font-size: 13px; padding: 5px 12px; border-radius: 999px; font-variant-numeric: tabular-nums; }
.idle { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; padding: 24px; gap: 18px; }
.idle h1 { font: 800 clamp(30px, 4.4vw, 54px)/1 var(--display); letter-spacing: -.03em; }
.idle p { color: var(--dim); max-width: 46ch; margin: 0 auto; }
.chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
.chip { background: var(--raise); box-shadow: 0 0 0 1px var(--line); padding: 6px 14px; border-radius: 999px; transition: background .15s; }
.chip:hover { background: var(--line); }
.film { display: flex; gap: 10px; margin-top: 14px; min-height: 52px; }
.film img { width: 84px; aspect-ratio: 16 / 10; object-fit: cover; object-position: top; border-radius: 6px; box-shadow: 0 0 0 1px var(--line); animation: pop .4s cubic-bezier(.2,1.4,.4,1) both; }
@keyframes pop { from { transform: scale(.6); opacity: 0; } }
.err { color: #ff8f8f; margin-top: 12px; }

/* Studio */
#studio { display: grid; grid-template-columns: 230px max-content minmax(300px, 400px); gap: 28px; justify-content: center; align-items: start; }
.rail, .details { min-width: 0; }
.rail h2, .details h3 { font-size: 13px; font-weight: 500; color: var(--dim); margin-bottom: 10px; }
.rail ul { list-style: none; padding: 0; display: grid; gap: 8px; }
.item { width: 100%; display: grid; grid-template-columns: 54px 1fr; gap: 12px; align-items: center; text-align: left; padding: 8px; border-radius: 12px; transition: background .15s; }
.item:hover { background: var(--panel); }
.item[aria-current="true"] { background: var(--raise); box-shadow: 0 0 0 1px var(--line); }
.item .th { width: 54px; aspect-ratio: 9 / 16; border-radius: 7px; background: var(--raise) center / cover; position: relative; overflow: hidden; }
.item .th::after { content: ''; position: absolute; left: 6px; bottom: 6px; width: 8px; height: 8px; border-radius: 50%; background: var(--c); box-shadow: 0 0 0 2px #000; }
.item b { display: block; font-weight: 600; line-height: 1.3; }
.item small { color: var(--dim); font-size: 12.5px; }
.item.saturated { opacity: .55; }
.rail .back { margin-top: 18px; color: var(--dim); font-weight: 500; }
.rail .back:hover { color: var(--ink); }

.player { display: grid; gap: 14px; justify-items: center; position: sticky; top: 76px; }
.phone { position: relative; height: min(76vh, 720px); aspect-ratio: 9 / 16; border-radius: 22px; overflow: hidden; background: #000; box-shadow: 0 0 0 1px var(--line), 0 30px 80px -20px rgba(61,107,255,.25); cursor: pointer; }
.phone canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
#develop { transition: opacity .6s; pointer-events: none; }
#develop.gone { opacity: 0; }
.making { position: absolute; left: 16px; top: 16px; font-size: 14px; transition: opacity .3s; pointer-events: none; }
.making.gone { opacity: 0; }
.controls { display: flex; align-items: center; gap: 12px; width: 0; min-width: 100%; } /* sized by the phone, not by its own content */
.play { width: 38px; height: 38px; border-radius: 50%; background: var(--raise); box-shadow: 0 0 0 1px var(--line); display: grid; place-items: center; flex: none; }
.play svg { width: 14px; height: 14px; fill: var(--ink); }
.segs { flex: 1; display: flex; gap: 4px; }
.segs button { flex: var(--w); height: 26px; position: relative; }
.segs button::before { content: ''; position: absolute; left: 0; right: 0; top: 11px; height: 4px; border-radius: 2px; background: var(--line); }
.segs button span { position: absolute; left: 0; top: 11px; height: 4px; border-radius: 2px; background: var(--ink); width: var(--p, 0%); }
.toggle { display: flex; align-items: center; gap: 8px; color: var(--dim); font-size: 13px; cursor: pointer; white-space: nowrap; }
.toggle input { appearance: none; width: 30px; height: 18px; border-radius: 999px; background: var(--line); position: relative; cursor: pointer; transition: background .2s; }
.toggle input::after { content: ''; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: var(--ink); transition: transform .2s; }
.toggle input:checked { background: var(--blue); }
.toggle input:checked::after { transform: translateX(12px); }

.details { padding-top: 4px; }
.tag { display: inline-block; font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: var(--c); color: #000; }
.details h1 { font: 800 32px/1.02 var(--display); letter-spacing: -.03em; margin: 14px 0 10px; text-wrap: balance; }
.details .why { color: var(--dim); }
.details section { margin-top: 26px; }
.beats { list-style: none; padding: 0; display: grid; gap: 2px; }
.beats li button { width: 100%; text-align: left; display: grid; grid-template-columns: 52px 1fr; gap: 10px; padding: 9px 10px; border-radius: 10px; transition: background .15s; }
.beats li button:hover { background: var(--panel); }
.beats li.on button { background: var(--raise); }
.beats .t { color: var(--dim); font-variant-numeric: tabular-nums; }
.beats li.on .t { color: var(--c); font-weight: 600; }
.beats .ost { display: inline-block; margin-top: 5px; font: 800 14px/1.2 var(--display); background: var(--ink); color: #000; padding: 2px 7px; border-radius: 4px; }
.cap { background: var(--panel); box-shadow: 0 0 0 1px var(--line); border-radius: 12px; padding: 12px 14px; }
.cap .h { color: var(--blue); margin-top: 4px; }
.refs { display: flex; gap: 10px; }
.refs a { width: 64px; aspect-ratio: 9 / 16; border-radius: 8px; background: var(--raise) center / cover; box-shadow: 0 0 0 1px var(--line); transition: transform .15s; }
.refs a:hover { transform: translateY(-2px); }
.actions { display: flex; align-items: center; gap: 6px; margin-top: 28px; flex-wrap: wrap; }
.actions .primary { padding: 11px 22px; }
.actions .quiet { padding: 11px 10px; }

.toast { position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 16px); background: var(--ink); color: #000; font-weight: 500; padding: 10px 18px; border-radius: 999px; opacity: 0; transition: .25s; z-index: 20; pointer-events: none; }
.toast.on { opacity: 1; transform: translate(-50%, 0); }

@media (max-width: 1100px) {
  #studio { grid-template-columns: max-content minmax(0, 380px); gap: 24px; }
  .phone { height: min(76vh, 720px, (100vw - 360px) * 1.7778); }
  .rail { grid-column: 1 / -1; contain: inline-size; } /* its long row must not widen the columns */
  .rail ul { display: flex; overflow-x: auto; padding-bottom: 6px; scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
  .item { width: 230px; flex: none; }
  .rail .back { display: none; }
}
@media (max-width: 760px) {
  .bar { grid-template-columns: 1fr auto; padding: 12px 16px; }
  .cmd { grid-column: 1 / -1; grid-row: 2; width: 100%; }
  .cmd select { max-width: 120px; }
  main { padding: 8px 16px 40px; }
  .view:has(.idle:not([hidden])) { aspect-ratio: 4 / 5; }
  #studio { grid-template-columns: 1fr; }
  .player { position: static; }
  .phone { height: auto; width: min(100%, 380px); }
  .controls { min-width: min(100%, 380px); }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<header class="bar">
  <button class="brand" id="home">Ad Guy</button>
  <form class="cmd" id="form">
    <input id="niche" placeholder="Any niche: fashion, food, gym, pets…" autocomplete="off" aria-label="Niche">
    <select id="region" aria-label="Country"></select>
    <button class="primary" id="go">Scout</button>
  </form>
  <button class="quiet" id="replayBtn" hidden>Replay last run</button>
</header>

<main>
  <section id="scout">
    <p class="note" id="note" aria-live="polite" hidden></p>
    <div class="window">
      <div class="chrome"><span class="lights"><i></i><i></i><i></i></span><span class="addr" id="addr">Agent browser</span></div>
      <div class="view">
        <canvas id="dots" aria-hidden="true"></canvas>
        <img id="shot" alt="">
        <div class="idle" id="idle">
          <h1>What's viral right now?</h1>
          <p>Pick a niche and a country. The agent browses Google Trends and YouTube, then cuts the trends it finds into video templates you can reshoot.</p>
          <div class="chips" id="chips"></div>
        </div>
        <span class="pct" id="pct" hidden>0%</span>
      </div>
    </div>
    <div class="film" id="film"></div>
    <p class="err" id="err" hidden></p>
  </section>

  <section id="studio" hidden>
    <nav class="rail">
      <h2 id="railTitle">Templates</h2>
      <ul id="list"></ul>
      <button class="back" id="again">Scout something else</button>
    </nav>
    <div class="player">
      <div class="phone" id="phone" title="Play or pause (Space)">
        <canvas id="reel" width="720" height="1280"></canvas>
        <canvas id="develop" aria-hidden="true"></canvas>
        <span class="making" id="making">Creating video</span>
      </div>
      <div class="controls">
        <button class="play" id="play" aria-label="Pause"><svg viewBox="0 0 14 14" id="playIcon"></svg></button>
        <div class="segs" id="segs"></div>
        <label class="toggle"><input type="checkbox" id="dir" checked> Directions</label>
      </div>
    </div>
    <article class="details" id="details"></article>
  </section>
</main>
<div class="toast" id="toast" role="status"></div>

<script>
const $ = (s) => document.querySelector(s);
const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
const COLOR = { rising: '#3d6bff', peaking: '#ffb547', saturated: '#5b606c' };
const REGIONS = [['WW', 'Worldwide'], ['PH', 'Philippines'], ['US', 'United States'], ['GB', 'United Kingdom'], ['CA', 'Canada'], ['AU', 'Australia'],
  ['IN', 'India'], ['ID', 'Indonesia'], ['MY', 'Malaysia'], ['SG', 'Singapore'], ['TH', 'Thailand'], ['VN', 'Vietnam'], ['JP', 'Japan'], ['KR', 'South Korea'],
  ['BR', 'Brazil'], ['MX', 'Mexico'], ['DE', 'Germany'], ['FR', 'France'], ['ES', 'Spain'], ['NG', 'Nigeria'], ['AE', 'United Arab Emirates']];
const NICHES = ['Fashion', 'Food', 'Fitness', 'Comedy', 'Beauty', 'Tech', 'Travel'];
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const wait = (ms) => new Promise((r) => setTimeout(r, still ? 0 : ms));
const store = { get(k) { try { return localStorage.getItem(k); } catch { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch {} } };
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove('on'), 2200); }

// ---------- dot field: dark dots, a wandering glow while working, and a dot-by-dot reveal of an image ----------
function dotField(canvas, { gap = 14, color = '#3d6bff' } = {}) {
  const ctx = canvas.getContext('2d'), seed = Math.random() * 100;
  let W, H, cols, rows, px = null, img = null, reveal = 0, revealTo = 0, dpr = 1, rand = [], raf, on = true;
  const tint = [1, 3, 5].map((i) => parseInt(color.slice(i, i + 2), 16));
  function size() {
    dpr = Math.min(devicePixelRatio || 1, 2); W = canvas.clientWidth; H = canvas.clientHeight;
    if (!W || !H) return;
    canvas.width = W * dpr; canvas.height = H * dpr;
    cols = Math.ceil(W / gap) + 1; rows = Math.ceil(H / gap) + 1;
    rand = Array.from({ length: cols * rows }, Math.random);
    if (img) sample(img);
  }
  function sample(im) {
    const o = document.createElement('canvas'); o.width = cols; o.height = rows;
    const c = o.getContext('2d'), w = im.naturalWidth || im.width, h = im.naturalHeight || im.height;
    const s = Math.max(cols / w, rows / h);
    c.drawImage(im, (cols - w * s) / 2, 0, w * s, h * s);
    px = c.getImageData(0, 0, cols, rows).data;
  }
  function frame(t) {
    if (!on) return;
    raf = requestAnimationFrame(frame);
    if (!W) return size();
    t = t / 1000 + seed; reveal += (revealTo - reveal) * 0.045;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, W, H);
    const bx = W * (0.5 + 0.32 * Math.sin(t * 0.37)), by = H * (0.45 + 0.3 * Math.cos(t * 0.29));
    const cx = W * (0.5 + 0.3 * Math.cos(t * 0.23 + 2)), cy = H * (0.55 + 0.28 * Math.sin(t * 0.31 + 1));
    const R = Math.max(W, H) * 0.2;
    for (let j = 0; j < rows; j++) for (let i = 0; i < cols; i++) {
      const x = i * gap, y = j * gap, k = j * cols + i;
      const glow = Math.exp(-((x - bx) ** 2 + (y - by) ** 2) / (R * R)) + 0.6 * Math.exp(-((x - cx) ** 2 + (y - cy) ** 2) / (R * R * 0.6));
      const tw = 0.5 + 0.5 * Math.sin(t * 2 + rand[k] * 20);
      let r = tint[0], g = tint[1], b = tint[2], a = 0.07 + glow * (0.55 + 0.35 * tw), rad = gap * (0.09 + glow * 0.07);
      if (px) {
        const o = Math.min(1, Math.max(0, (reveal * 1.25 - rand[k]) * 4)), p = k * 4, lum = (px[p] + px[p + 1] + px[p + 2]) / 765;
        r += (px[p] - r) * o; g += (px[p + 1] - g) * o; b += (px[p + 2] - b) * o;
        a += (0.35 + lum * 0.65 - a) * o; rad += (gap * (0.16 + lum * 0.14) - rad) * o;
      }
      ctx.fillStyle = `rgba(${r | 0},${g | 0},${b | 0},${a})`;
      ctx.beginPath(); ctx.arc(x, y, rad, 0, 6.283); ctx.fill();
    }
  }
  new ResizeObserver(size).observe(canvas);
  raf = requestAnimationFrame(frame);
  return {
    image(src) {
      return new Promise((done) => {
        const set = (im) => { img = im; size(); reveal = 0; revealTo = 1; setTimeout(done, still ? 0 : 1100); };
        if (typeof src !== 'string') return set(src);
        const im = new Image(); im.onload = () => set(im); im.onerror = () => done(); im.src = src;
      });
    },
    clear() { img = null; px = null; reveal = revealTo = 0; },
    start() { if (!on) { on = true; raf = requestAnimationFrame(frame); } },
    stop() { on = false; cancelAnimationFrame(raf); },
  };
}

// ---------- reel renderer: draws a template as a playable 9:16 video ----------
const RW = 720, RH = 1280;
function timeline(t) {
  const n = t.beats.length, d = t.duration_s || 15;
  let spans = t.beats.map((b) => (String(b.t).match(/([\d.]+)\s*[-–]\s*([\d.]+)/) || []).slice(1).map(Number));
  if (spans.some((s) => s.length < 2 || !(s[1] > s[0]))) spans = t.beats.map((_, i) => [(i * d) / n, ((i + 1) * d) / n]);
  return { spans, total: Math.max(d, spans[spans.length - 1][1]) };
}
function wrap(ctx, text, max) {
  const lines = []; let line = '';
  for (const w of String(text).split(/\s+/)) {
    const test = line ? line + ' ' + w : w;
    if (ctx.measureText(test).width > max && line) { lines.push(line); line = w; } else line = test;
  }
  if (line) lines.push(line);
  return lines;
}
const easeBack = (x) => 1 + 2.2 * (x - 1) ** 3 + 1.2 * (x - 1) ** 2;
function rrect(ctx, x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); ctx.fill(); }

function drawReel(ctx, t, imgs, time, directions) {
  const { spans, total } = timeline(t), c = COLOR[t.momentum] || COLOR.rising;
  time = Math.min(time, total - 0.001);
  const bi = Math.max(0, spans.findIndex(([a, b]) => time >= a && time < b)), [a, b] = spans[bi], beat = t.beats[bi];
  const local = time - a, k = local / (b - a);
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, RW, RH);
  // footage: the reference video's frame with a slow push-in and a punch on every cut
  const im = imgs.length ? imgs[bi % imgs.length] : null;
  ctx.save();
  if (im) {
    const punch = Math.max(0, 1 - local / 0.25) * 0.08, s = Math.max(RW / im.width, RH / im.height) * (1.04 + 0.08 * k + punch);
    const dx = (bi % 2 ? -1 : 1) * 24 * k;
    ctx.drawImage(im, (RW - im.width * s) / 2 + dx, (RH - im.height * s) / 2, im.width * s, im.height * s);
  } else {
    const g = ctx.createLinearGradient(0, 0, RW, RH); g.addColorStop(0, c); g.addColorStop(1, '#000');
    ctx.fillStyle = g; ctx.fillRect(0, 0, RW, RH);
  }
  ctx.restore();
  let g = ctx.createLinearGradient(0, RH * 0.55, 0, RH); g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,.85)');
  ctx.fillStyle = 'rgba(0,0,0,.18)'; ctx.fillRect(0, 0, RW, RH); ctx.fillStyle = g; ctx.fillRect(0, 0, RW, RH);
  const flash = Math.max(0, 1 - local / 0.12);
  if (flash && time > 0.05) { ctx.fillStyle = `rgba(255,255,255,${flash * 0.5})`; ctx.fillRect(0, 0, RW, RH); }

  // progress segments, like stories
  const gapW = 8, segW = (RW - 48 - gapW * (spans.length - 1)) / spans.length;
  spans.forEach(([s0, s1], i) => {
    const f = Math.min(1, Math.max(0, (time - s0) / (s1 - s0)));
    ctx.fillStyle = 'rgba(255,255,255,.3)'; rrect(ctx, 24 + i * (segW + gapW), 28, segW, 5, 3);
    if (f) { ctx.fillStyle = '#fff'; rrect(ctx, 24 + i * (segW + gapW), 28, segW * f, 5, 3); }
  });

  // on-screen text, in the classic white-box style, popping in on each beat
  const text = beat.text || (bi === 0 ? t.hook : '');
  if (text) {
    const p = Math.min(1, local / 0.28), sc = 0.82 + 0.18 * easeBack(p);
    ctx.save(); ctx.translate(RW / 2, RH * 0.36); ctx.scale(sc, sc); ctx.globalAlpha = Math.min(1, p * 2);
    ctx.font = '800 54px "Bricolage Grotesque"'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    const lines = wrap(ctx, text, RW - 150), lh = 70, top = -((lines.length - 1) * lh) / 2;
    lines.forEach((l, i) => { const w = ctx.measureText(l).width + 36; ctx.fillStyle = '#fff'; rrect(ctx, -w / 2, top + i * lh - 34, w, 66, 12); });
    ctx.fillStyle = '#000'; lines.forEach((l, i) => ctx.fillText(l, 0, top + i * lh + 2));
    ctx.restore();
  }

  // shooting direction for the creator
  let y = RH - 250;
  if (directions) {
    ctx.font = '500 25px Geist'; ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
    const lines = wrap(ctx, beat.shot, RW - 120).slice(0, 3), h = 58 + lines.length * 33;
    y = RH - 250 - h - 18;
    ctx.fillStyle = 'rgba(0,0,0,.6)'; rrect(ctx, 24, y, RW - 48, h, 18);
    ctx.fillStyle = c; ctx.font = '600 21px Geist'; ctx.fillText(`Shot ${bi + 1} of ${spans.length}  ·  ${beat.t}`, 48, y + 40);
    ctx.fillStyle = '#fff'; ctx.font = '500 25px Geist'; lines.forEach((l, i) => ctx.fillText(l, 48, y + 76 + i * 33));
  }

  // the post itself: handle, caption, sound
  ctx.textAlign = 'left'; ctx.fillStyle = '#fff'; ctx.font = '600 28px Geist'; ctx.fillText('@yourhandle', 32, RH - 190);
  ctx.font = '400 25px Geist';
  wrap(ctx, t.caption, RW - 140).slice(0, 2).forEach((l, i) => ctx.fillText(l, 32, RH - 148 + i * 33));
  ctx.fillStyle = '#9fb4ff'; ctx.fillText(t.hashtags.slice(0, 4).join(' '), 32, RH - 76);
  ctx.fillStyle = 'rgba(255,255,255,.8)'; ctx.font = '500 22px Geist';
  ctx.fillText('♪ ' + wrap(ctx, t.audio, RW - 120)[0], 32, RH - 36);
  return { bi, k, total };
}

// ---------- scouting ----------
const dots = dotField($('#dots'), { gap: 12 });
let source, pct = 0, pctTo = 0, max = 18, lastRun = null, queue = Promise.resolve();
(function tick() { pct += (pctTo - pct) * 0.08; $('#pct').textContent = Math.round(pct) + '%'; requestAnimationFrame(tick); })();
const host = (u) => { try { const x = new URL(u); return x.host.replace(/^www\./, '') + x.pathname.replace(/\/$/, '') + x.search; } catch { return u || ''; } };

function showScout() { $('#scout').hidden = false; $('#studio').hidden = true; player.stop(); dots.start(); }
function start(url, label) {
  source?.close(); queue = Promise.resolve();
  showScout(); dots.clear();
  $('#shot').classList.remove('on'); $('#idle').hidden = true; $('#pct').hidden = false; $('#err').hidden = true;
  $('#film').innerHTML = ''; $('#note').hidden = false; $('#note').textContent = `Scouting ${label}`; $('#addr').textContent = 'Opening a browser…';
  pct = pctTo = 0; $('#go').disabled = true;
  source = new EventSource(url);
  source.onmessage = (m) => { const ev = JSON.parse(m.data); queue = queue.then(() => handle(ev)).catch(console.error); };
  source.onerror = () => { source.close(); $('#go').disabled = false; };
}
let runInfo = {};
async function handle(ev) {
  if (ev.type === 'start') { max = ev.max; runInfo = ev; }
  if (ev.type === 'step') {
    $('#note').textContent = ev.note || ev.args.join(' ');
    pctTo = Math.min(92, (ev.step / Math.min(max, 10)) * 90);
    if (ev.args?.[0] === 'open') { $('#shot').classList.remove('on'); $('#addr').textContent = host(ev.args[1]); await wait(400); dots.clear(); }
  }
  if (ev.type === 'shot' && ev.src) {
    $('#shot').classList.remove('on'); await wait(300); dots.clear();
    $('#addr').textContent = host(ev.url);
    await dots.image(ev.src);
    $('#shot').src = ev.src; $('#shot').classList.add('on');
    const f = new Image(); f.src = ev.src; f.alt = ''; $('#film').append(f);
    await wait(900);
  }
  if (ev.type === 'templates') {
    source.close(); pctTo = 100; $('#go').disabled = false;
    $('#note').textContent = `Found ${ev.templates.length} trends. Cutting them into videos…`;
    await wait(1100);
    openStudio(ev.templates);
    loadRuns();
  }
  if (ev.type === 'error') {
    source.close(); $('#go').disabled = false;
    $('#note').textContent = 'The scout stopped';
    $('#err').hidden = false; $('#err').textContent = ev.message + (lastRun ? ' Replay the last run to see the result of an earlier scout.' : '');
  }
}

// ---------- studio ----------
const reelCtx = $('#reel').getContext('2d');
let templates = [], cur = -1, imgsBy = new Map(), developed = new Set();
const label = (t) => t.momentum === 'saturated' ? 'Overplayed, skip' : `${t.momentum === 'peaking' ? 'Peaking' : 'Rising'}, ~${t.days_left} days left`;
function loadImgs(t) {
  const ids = (t.references || []).filter((id) => /^[\w-]{11}$/.test(id));
  return Promise.all(ids.map((id) => new Promise((r) => { const im = new Image(); im.onload = () => r(im); im.onerror = () => r(null); im.src = '/api/thumb?id=' + id; })))
    .then((list) => list.filter(Boolean));
}

const player = (() => {
  let raf, playing = false, t0 = 0, at = 0, total = 1, tpl = null, imgs = [];
  const loop = (now) => {
    if (playing) at = (now - t0) / 1000;
    if (at >= total) { at = 0; t0 = now; }
    const r = drawReel(reelCtx, tpl, imgs, at, $('#dir').checked);
    sync(r);
    raf = requestAnimationFrame(loop);
  };
  return {
    load(t, im) { tpl = t; imgs = im; total = timeline(t).total; at = 0; t0 = performance.now(); cancelAnimationFrame(raf); raf = requestAnimationFrame(loop); },
    play(p = !playing) { playing = p; t0 = performance.now() - at * 1000; icon(); },
    seek(s) { at = s; t0 = performance.now() - s * 1000; },
    stop() { cancelAnimationFrame(raf); playing = false; },
    get playing() { return playing; },
  };
})();
function icon() {
  $('#playIcon').innerHTML = player.playing ? '<rect x="2" y="1" width="3.5" height="12" rx="1"/><rect x="8.5" y="1" width="3.5" height="12" rx="1"/>' : '<path d="M3 1.5v11l9.5-5.5z"/>';
  $('#play').setAttribute('aria-label', player.playing ? 'Pause' : 'Play');
}
let lastBeat = -1;
function sync({ bi, k }) {
  const segs = $('#segs').children;
  for (let i = 0; i < segs.length; i++) segs[i].style.setProperty('--p', (i < bi ? 100 : i === bi ? k * 100 : 0) + '%');
  if (bi !== lastBeat) { lastBeat = bi; document.querySelectorAll('.beats li').forEach((li, i) => li.classList.toggle('on', i === bi)); }
}

function openStudio(list) {
  const order = { rising: 0, peaking: 1, saturated: 2 };
  templates = [...list].sort((a, b) => order[a.momentum] - order[b.momentum]);
  imgsBy = new Map(); developed = new Set(); cur = -1;
  const live = templates.filter((t) => t.momentum !== 'saturated').length;
  $('#railTitle').textContent = `${live} worth shooting${runInfo.regionName ? ` in ${runInfo.regionName}` : ''}`;
  $('#list').innerHTML = templates.map((t, i) => `<li><button class="item ${t.momentum}" style="--c:${COLOR[t.momentum]}" data-i="${i}">
    <span class="th"${t.references?.[0] ? ` style="background-image:url('/api/thumb?id=${esc(t.references[0])}')"` : ''}></span>
    <span><b>${esc(t.title)}</b><small>${esc(label(t))}</small></span></button></li>`).join('');
  $('#scout').hidden = true; $('#studio').hidden = false; dots.stop();
  select(0);
}
$('#list').onclick = (e) => { const b = e.target.closest('.item'); if (b) select(+b.dataset.i); };

const develop = dotField($('#develop'), { gap: 9 });
async function select(i) {
  if (i === cur || !templates[i]) return;
  cur = i; const t = templates[i], c = COLOR[t.momentum];
  document.querySelectorAll('.item').forEach((b) => b.setAttribute('aria-current', String(+b.dataset.i === i)));
  const { spans, total } = timeline(t);
  $('#segs').innerHTML = spans.map(([a, b], j) => `<button style="--w:${b - a}" data-s="${a}" aria-label="Jump to shot ${j + 1}"><span></span></button>`).join('');
  $('#details').style.setProperty('--c', c);
  $('#details').innerHTML = `<span class="tag">${esc(label(t))}</span>
    <h1>${esc(t.title)}</h1><p class="why">${esc(t.trend)}</p>
    <section><h3>Shot list · ${t.duration_s}s, ${esc(t.format)}</h3><ol class="beats">${t.beats.map((b, j) => `<li><button data-s="${spans[j][0]}">
      <span class="t">${esc(b.t)}</span><span>${esc(b.shot)}${b.text ? `<br><span class="ost">${esc(b.text)}</span>` : ''}</span></button></li>`).join('')}</ol></section>
    <section><h3>Caption</h3><div class="cap">${esc(t.caption)}<div class="h">${esc(t.hashtags.join(' '))}</div></div></section>
    <section><h3>Sound</h3><p>${esc(t.audio)}</p></section>
    ${t.references?.length ? `<section><h3>Based on these videos</h3><div class="refs">${t.references.map((id) => `<a href="https://www.youtube.com/watch?v=${esc(id)}" target="_blank" rel="noopener" aria-label="Watch reference video on YouTube" style="background-image:url('/api/thumb?id=${esc(id)}')"></a>`).join('')}</div></section>` : ''}
    <div class="actions"><button class="primary" id="export">Export video</button><button class="quiet" id="copy">Copy shot list</button><button class="quiet" id="json">Download .json</button></div>`;
  lastBeat = -1;
  if (!imgsBy.has(t)) imgsBy.set(t, loadImgs(t));
  const [imgs] = await Promise.all([imgsBy.get(t), document.fonts.load('800 54px "Bricolage Grotesque"'), document.fonts.load('500 25px Geist')]);
  if (cur !== i) return;
  player.load(t, imgs);
  if (developed.has(t) || still) { $('#develop').classList.add('gone'); $('#making').classList.add('gone'); player.play(true); return; }
  // first view: the video develops out of the dot grid, like an image being generated
  developed.add(t); player.play(false); player.seek(0.6);
  develop.clear(); develop.start(); $('#develop').classList.remove('gone'); $('#making').classList.remove('gone');
  await wait(900);
  const frame = document.createElement('canvas'); frame.width = RW; frame.height = RH;
  drawReel(frame.getContext('2d'), t, imgs, 0.6, false);
  await develop.image(frame);
  if (cur !== i) return;
  $('#develop').classList.add('gone'); $('#making').classList.add('gone');
  await wait(500); develop.stop(); player.seek(0); player.play(true);
}

$('#studio').addEventListener('click', (e) => {
  const s = e.target.closest('[data-s]'); if (s) { player.seek(+s.dataset.s + 0.001); return; }
  if (e.target.id === 'copy') navigator.clipboard.writeText(shotList(templates[cur])).then(() => toast('Shot list copied'));
  if (e.target.id === 'json') download(new Blob([JSON.stringify(templates[cur], null, 2)], { type: 'application/json' }), slug(templates[cur]) + '.json', 'Template downloaded');
  if (e.target.id === 'export') exportVideo(e.target);
});
$('#phone').onclick = () => player.play();
$('#play').onclick = () => player.play();
const slug = (t) => t.title.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
function download(blob, name, msg) { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 5000); toast(msg); }
function shotList(t) {
  return `${t.title} (${t.format}, ${t.duration_s}s)\nSound: ${t.audio}\n\n` +
    t.beats.map((b) => `${b.t}  ${b.shot}${b.text ? `\n       On screen: "${b.text}"` : ''}`).join('\n') + `\n\nCaption: ${t.caption}\n${t.hashtags.join(' ')}`;
}

// Records the reel in real time from an offscreen canvas. mp4 where the browser can, webm otherwise.
async function exportVideo(btn) {
  const t = templates[cur], imgs = await imgsBy.get(t), { total } = timeline(t), dir = $('#dir').checked;
  const cv = document.createElement('canvas'); cv.width = RW; cv.height = RH;
  const ctx = cv.getContext('2d');
  const type = ['video/mp4;codecs=avc1.42E01E', 'video/mp4', 'video/webm;codecs=vp9', 'video/webm'].find((m) => MediaRecorder.isTypeSupported(m));
  const rec = new MediaRecorder(cv.captureStream(30), { mimeType: type, videoBitsPerSecond: 6e6 });
  const chunks = []; rec.ondataavailable = (e) => e.data.size && chunks.push(e.data);
  btn.disabled = true;
  const done = new Promise((r) => (rec.onstop = r));
  drawReel(ctx, t, imgs, 0, dir); rec.start();
  const t0 = performance.now();
  await new Promise((r) => {
    (function f() {
      const s = (performance.now() - t0) / 1000;
      drawReel(ctx, t, imgs, Math.min(s, total - 0.01), dir);
      btn.textContent = `Exporting ${Math.min(99, Math.round((s / total) * 100))}%`;
      if (s < total) requestAnimationFrame(f); else r();
    })();
  });
  rec.stop(); await done;
  btn.disabled = false; btn.textContent = 'Export video';
  download(new Blob(chunks, { type }), slug(t) + (type.includes('mp4') ? '.mp4' : '.webm'), 'Video exported');
}

// ---------- wiring ----------
$('#region').innerHTML = REGIONS.map(([c, n]) => `<option value="${c}">${n}</option>`).join('');
$('#region').value = store.get('region') || 'WW';
$('#region').onchange = () => store.set('region', $('#region').value);
$('#chips').innerHTML = NICHES.map((n) => `<button class="chip" type="button">${n}</button>`).join('');
$('#chips').onclick = (e) => { if (e.target.matches('.chip')) { $('#niche').value = e.target.textContent; $('#form').requestSubmit(); } };
$('#form').onsubmit = (e) => {
  e.preventDefault();
  const niche = $('#niche').value.trim() || 'anything', r = $('#region'), name = r.selectedOptions[0].textContent;
  start(`/api/scout?niche=${encodeURIComponent(niche)}&region=${r.value}&regionName=${encodeURIComponent(name)}`, `${niche} in ${name}`);
};
async function loadRuns() {
  const runs = await fetch('/api/runs').then((r) => r.json()).catch(() => []);
  lastRun = runs.find((r) => r.id !== 'sample') || runs[0] || null;
  $('#replayBtn').hidden = !lastRun;
}
$('#replayBtn').onclick = () => lastRun && start('/api/replay?id=' + encodeURIComponent(lastRun.id), `${lastRun.niche} in ${lastRun.regionName || 'Worldwide'}`);
function home() {
  source?.close(); $('#go').disabled = false; showScout(); dots.clear();
  $('#shot').classList.remove('on'); $('#idle').hidden = false; $('#pct').hidden = true; $('#film').innerHTML = ''; $('#err').hidden = true;
  $('#addr').textContent = 'Agent browser'; $('#note').hidden = true; $('#niche').focus();
}
$('#home').onclick = home; $('#again').onclick = home;
addEventListener('keydown', (e) => {
  if ($('#studio').hidden || e.target.matches('input, select, textarea')) return;
  if (e.code === 'Space') { e.preventDefault(); player.play(); }
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); select(cur + (e.key === 'ArrowDown' ? 1 : -1)); }
});
icon(); loadRuns();
</script>
</body>
</html>
