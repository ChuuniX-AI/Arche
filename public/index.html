<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arche</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #000; --panel: #0b0c0f; --raise: #15171c; --line: #1f2129;
  --ink: #eceef3; --dim: #8b91a0; --blue: #3d6bff; --amber: #ffb547; --grey: #5b606c; --red: #ff8f8f;
  --display: 'Bricolage Grotesque', system-ui, sans-serif; --ui: 'Geist', system-ui, sans-serif;
}
* { box-sizing: border-box; margin: 0; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font: 400 14px/1.5 var(--ui); -webkit-font-smoothing: antialiased; overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; border-radius: 8px; }
[hidden] { display: none !important; }
.primary { background: var(--ink); color: #000; font-weight: 600; padding: 9px 20px; border-radius: 999px; white-space: nowrap; transition: transform .15s; }
.primary:hover { transform: scale(1.03); }
.primary:disabled { opacity: .5; cursor: default; transform: none; }
.secondary { background: var(--raise); box-shadow: 0 0 0 1px var(--line); font-weight: 500; padding: 9px 18px; border-radius: 999px; white-space: nowrap; }
.secondary:hover { background: var(--line); }
.secondary:disabled { opacity: .5; cursor: default; }
.quiet { color: var(--dim); font-weight: 500; padding: 8px 6px; white-space: nowrap; }
.quiet:hover { color: var(--ink); }

.app { display: grid; grid-template-columns: 264px 1fr; height: 100vh; height: 100dvh; }

/* Sidebar: threads, like a chat app */
.side { background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; padding: 16px 12px; gap: 14px; min-height: 0; }
.brand { font: 800 19px/1 var(--display); letter-spacing: -.02em; padding: 6px 8px; text-align: left; }
.new { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 10px; font-weight: 500; box-shadow: 0 0 0 1px var(--line); }
.new:hover { background: var(--raise); }
.new svg { width: 14px; height: 14px; stroke: currentColor; stroke-width: 2; }
.side h2 { font-size: 12.5px; font-weight: 500; color: var(--dim); padding: 0 10px; margin-bottom: 6px; }
.side nav { overflow-y: auto; min-height: 0; scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
.side ul { list-style: none; padding: 0; display: grid; gap: 2px; }
.th { width: 100%; text-align: left; padding: 8px 10px; border-radius: 10px; display: grid; }
.th:hover { background: var(--raise); }
.th[aria-current="true"] { background: var(--raise); box-shadow: 0 0 0 1px var(--line); }
.th b { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.th small { color: var(--dim); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.main { position: relative; min-width: 0; min-height: 0; display: flex; flex-direction: column; }
.top { display: flex; align-items: center; gap: 12px; padding: 14px 24px; min-height: 58px; }
.top .ttl { flex: 1; min-width: 0; display: grid; }
.top .ttl b { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.top .ttl .who { justify-self: start; max-width: 100%; color: var(--dim); font-size: 12.5px; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.top .ttl .who:not(:disabled):hover { color: var(--ink); text-decoration: underline; text-underline-offset: 3px; }
.top .ttl .who:disabled { cursor: default; }
.icon { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; flex: none; }
.icon:hover { background: var(--raise); }
.icon svg { width: 18px; height: 18px; stroke: currentColor; stroke-width: 1.8; fill: none; }
#menu { display: none; }

/* Chat */
.chat { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.scroll { flex: 1; min-height: 0; overflow-y: auto; scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
.log { max-width: 780px; margin: 0 auto; padding: 8px 24px 32px; display: grid; gap: 22px; }
.you { justify-self: end; max-width: 80%; background: var(--raise); padding: 10px 16px; border-radius: 18px 18px 4px 18px; white-space: pre-wrap; }
.reply { white-space: pre-wrap; max-width: 64ch; }
.pnote { color: var(--dim); display: flex; gap: 8px; align-items: center; }
.pnote::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--blue); flex: none; }
.err { color: var(--red); }
.thinking { color: var(--dim); display: flex; gap: 10px; align-items: center; }
.spin { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--line); border-top-color: var(--blue); animation: spin .8s linear infinite; flex: none; }
@keyframes spin { to { transform: rotate(360deg); } }

/* The live browser */
.browse .step { display: flex; gap: 10px; align-items: center; margin-bottom: 10px; color: var(--ink); font-weight: 500; }
.window { border-radius: 14px; overflow: hidden; background: var(--panel); box-shadow: 0 0 0 1px var(--line); }
.chrome { display: flex; align-items: center; gap: 12px; padding: 9px 14px; border-bottom: 1px solid var(--line); }
.lights { display: flex; gap: 6px; } .lights i { width: 10px; height: 10px; border-radius: 50%; background: var(--line); }
.addr { flex: 1; min-width: 0; background: var(--raise); border-radius: 999px; padding: 3px 14px; color: var(--dim); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.live-dot { display: flex; align-items: center; gap: 6px; color: var(--dim); font-size: 12px; }
.live-dot::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: #ff4d4d; animation: blink 1.4s infinite; }
@keyframes blink { 50% { opacity: .3; } }
.view { position: relative; aspect-ratio: 16 / 10; background: #fff; }
.view img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: top; }
.view .wait { position: absolute; inset: 0; display: grid; place-items: center; background: var(--panel); color: var(--dim); }

.film { display: flex; gap: 6px; }
.film img { width: 52px; aspect-ratio: 16 / 10; object-fit: cover; object-position: top; border-radius: 5px; box-shadow: 0 0 0 1px var(--line); }

/* The agent's cursor over the browser: where it clicks, what it reads, what it collects */
.ov { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.cur { position: absolute; z-index: 3; transition: left .75s cubic-bezier(.45,0,.2,1), top .75s cubic-bezier(.45,0,.2,1); }
.cur svg { display: block; width: 24px; height: 24px; fill: #fff; stroke: #0a0b0e; stroke-width: 1.4; stroke-linejoin: round; filter: drop-shadow(0 0 7px rgba(61,107,255,.95)) drop-shadow(0 3px 5px rgba(0,0,0,.45)); }
.bub { position: absolute; left: 20px; top: 20px; max-width: 280px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; background: var(--blue); color: #fff;
  font-size: 12px; font-weight: 500; padding: 4px 11px; border-radius: 4px 999px 999px 999px; box-shadow: 0 8px 20px rgba(61,107,255,.45); }
.cur.flip .bub { left: auto; right: 6px; border-radius: 999px 4px 999px 999px; }
.bub:empty { display: none; }
.ring { position: absolute; z-index: 2; width: 44px; height: 44px; margin: -22px 0 0 -22px; border-radius: 50%; border: 2px solid var(--blue); animation: ring .6s ease-out forwards; }
@keyframes ring { from { transform: scale(.3); opacity: 1; } to { transform: scale(1.6); opacity: 0; } }
.hl { position: absolute; z-index: 1; border-radius: 8px; box-shadow: 0 0 0 2px var(--blue), 0 0 24px rgba(61,107,255,.5); background: rgba(61,107,255,.1); animation: hl 2.4s ease-out forwards; }
@keyframes hl { 0% { opacity: 0; transform: scale(.96); } 12% { opacity: 1; transform: none; } 75% { opacity: 1; } 100% { opacity: 0; } }
.scan { position: absolute; left: 0; right: 0; height: 26%; top: -26%; opacity: 0; background: linear-gradient(rgba(61,107,255,0), rgba(61,107,255,.16) 75%, rgba(61,107,255,.4)); border-bottom: 2px solid rgba(110,145,255,.95); }
.scan.on { animation: scan 1.7s cubic-bezier(.4,0,.2,1); }
@keyframes scan { 0% { top: -26%; opacity: 1; } 88% { opacity: 1; } 100% { top: 100%; opacity: 0; } }

/* A finished browse: one row that replays it */
.bhead { display: flex; align-items: center; gap: 12px; color: var(--dim); padding: 4px 6px 4px 4px; margin-left: -4px; border-radius: 12px; text-align: left; transition: background .15s, color .15s; }
.bhead:hover { background: var(--panel); color: var(--ink); }
.bhead { max-width: 100%; }
.bhead .film { min-width: 0; overflow: hidden; -webkit-mask-image: linear-gradient(90deg, #000 75%, transparent); mask-image: linear-gradient(90deg, #000 75%, transparent); }
.bhead .film img { flex: none; }
.bhead .pp { width: 30px; height: 30px; border-radius: 50%; background: var(--raise); box-shadow: 0 0 0 1px var(--line); display: grid; place-items: center; flex: none; }
.bhead .pp svg, .rp-pp svg { width: 11px; height: 11px; fill: currentColor; }
.bhead:hover .pp { background: var(--blue); box-shadow: none; color: #fff; }
.rp { margin-top: 10px; }
.rp .view img { transition: opacity .35s; }
.rp .view img.kb { animation: kb 2.4s ease-out both; transform-origin: 50% 0; }
@keyframes kb { from { transform: scale(1.06); } to { transform: none; } }
.rp-cap { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); z-index: 4; max-width: 86%; background: rgba(10,11,14,.82); backdrop-filter: blur(8px); color: #fff;
  font-size: 13.5px; font-weight: 500; padding: 7px 14px; border-radius: 999px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rp-n { color: var(--dim); font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.rp-bar { display: flex; align-items: center; gap: 12px; margin-top: 10px; }
.rp-pp { width: 32px; height: 32px; border-radius: 50%; background: var(--raise); box-shadow: 0 0 0 1px var(--line); display: grid; place-items: center; flex: none; }
.rp-segs { flex: 1; display: flex; gap: 4px; }
.rp-segs button { flex: 1; height: 22px; position: relative; }
.rp-segs button::before, .rp-segs button span { content: ''; position: absolute; left: 0; top: 9px; height: 4px; border-radius: 2px; }
.rp-segs button::before { right: 0; background: var(--line); }
.rp-segs button span { width: 0; background: var(--ink); }
.rp-segs button.done span { width: 100%; }
.rp-segs button.on span { animation: seg var(--dur) linear forwards; }
.rp-segs.paused button.on span { animation-play-state: paused; }
@keyframes seg { to { width: 100%; } }

/* What the agent found while browsing */
.log > * { min-width: 0; } /* long shelves and card rows scroll inside, never widen the chat */
.ghost { position: fixed; z-index: 50; transform-origin: 0 0; background: var(--raise) center / cover; pointer-events: none; box-shadow: 0 18px 40px rgba(0,0,0,.6), 0 0 0 1px rgba(255,255,255,.15); }
.found { margin-top: 12px; }
.flabel { font-size: 12.5px; color: var(--dim); margin-bottom: 8px; }
.flabel b { color: var(--ink); font-weight: 500; }
.shelf { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 8px; scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
.fv { flex: none; width: 66px; display: grid; gap: 5px; color: var(--dim); font-size: 11px; text-decoration: none; animation: slidein .5s cubic-bezier(.2,1.25,.4,1) both; animation-delay: var(--d, 0ms); }
.fv i { aspect-ratio: 9 / 16; border-radius: 8px; background: var(--raise) center / cover; box-shadow: 0 0 0 1px var(--line); transition: transform .15s; }
.fv:hover i { transform: translateY(-2px); }
.fv span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; }
.fv.used i { box-shadow: 0 0 0 2px var(--blue); }
.fv.used span { color: var(--ink); }
.fv.old i { opacity: .35; filter: grayscale(1); }
.fv.old span { text-decoration: line-through; text-decoration-color: rgba(139,145,160,.6); }

/* The trend board: patterns many creators share, and the agent's verdicts */
.board { margin-top: 14px; background: var(--panel); box-shadow: 0 0 0 1px var(--line); border-radius: 16px; padding: 12px 12px 6px; }
.board .flabel { padding: 0 4px; }
.brows { list-style: none; padding: 0; display: grid; }
.br { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; padding: 9px 4px; border-top: 1px solid var(--line); }
.br:first-child { border-top: 0; }
.br.new { animation: brin .45s cubic-bezier(.2,1.2,.4,1) both; }
@keyframes brin { from { opacity: 0; transform: translateY(8px); } }
.bstack { display: flex; }
.bstack i { width: 22px; aspect-ratio: 9 / 16; border-radius: 4px; background: var(--raise) center / cover; box-shadow: 0 0 0 2px var(--panel); margin-left: -7px; }
.bstack i:first-child { margin-left: 0; }
.bmain { min-width: 0; display: grid; gap: 2px; }
.bmain b { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bmain small { color: var(--dim); font-size: 12px; font-variant-numeric: tabular-nums; }
.bmain .why { color: var(--ink); opacity: .8; }
.bchip { font-size: 11.5px; font-weight: 600; padding: 3px 10px; border-radius: 999px; white-space: nowrap; display: flex; align-items: center; gap: 6px; }
.br.checking .bchip { color: var(--blue); background: rgba(61,107,255,.12); }
.br.checking .bchip::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--blue); animation: blink 1.2s infinite; }
.br.confirmed .bchip { color: #000; background: #3ddc97; }
.br.confirmed.flash { animation: flash .9s ease-out; }
@keyframes flash { from { background: rgba(61,220,151,.25); } }
.br.dropped { opacity: .55; }
.br.unfollowed .bchip { color: var(--dim); background: var(--raise); }
.br.dropped .bmain b { text-decoration: line-through; text-decoration-color: var(--grey); }
.br.dropped .bchip { color: var(--dim); background: var(--raise); }
.shelf.static .fv { animation: none; }
@keyframes slidein { from { opacity: 0; transform: translateY(16px) scale(.8); } }

/* The card grows into the phone */
.phone { view-transition-name: reel; }
::view-transition-group(reel) { animation-duration: .5s; animation-timing-function: cubic-bezier(.2,.8,.2,1); }
::view-transition-old(root), ::view-transition-new(root) { animation-duration: .25s; }

/* Persona profile: the creator you're becoming */
#profile { flex: 1; min-height: 0; overflow-y: auto; padding: 0 24px 48px; scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
.prof { max-width: 880px; margin: 0 auto; }
.banner { position: relative; display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 3px; aspect-ratio: 3 / 1; border-radius: 22px; overflow: hidden; background: color-mix(in srgb, var(--pc) 30%, #0b0c0f); }
.banner i { background: center 28% / cover; }
.banner::after { content: ''; position: absolute; inset: 0; background: linear-gradient(transparent 45%, rgba(0,0,0,.85)); }
.phead { position: relative; display: grid; grid-template-columns: auto 1fr auto; gap: 18px; align-items: end; margin: -46px 20px 0; z-index: 1; }
.pav { display: grid; place-items: center; font-family: var(--display); font-weight: 800; line-height: 1; color: #000; }
.pav.big { width: 92px; height: 92px; border-radius: 50%; font-size: 32px; box-shadow: 0 0 0 5px var(--bg); }
.phead h1 { font: 800 clamp(28px, 4vw, 44px)/1 var(--display); letter-spacing: -.03em; text-wrap: balance; }
.phead p { color: var(--dim); margin-top: 6px; max-width: 52ch; }
.pchips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.pchips span { font-size: 12px; padding: 3px 10px; border-radius: 999px; background: var(--raise); box-shadow: 0 0 0 1px var(--line); color: var(--dim); }
.pchips span.yes { color: var(--ink); box-shadow: 0 0 0 1px var(--pc); }
.pacts { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; padding-bottom: 4px; }
.pgrid { display: grid; grid-template-columns: 1.1fr 1fr; gap: 28px; margin-top: 36px; }
.pgrid h3, .made h3 { font-size: 13px; font-weight: 500; color: var(--dim); margin-bottom: 10px; }
.pgrid section + section { margin-top: 22px; }
.quotes { list-style: none; padding: 0; display: grid; gap: 8px; justify-items: start; }
.quotes li { font: 800 15px/1.45 var(--display); background: #fff; color: #000; padding: 4px 10px; border-radius: 7px; max-width: 100%; }
.made { margin-top: 40px; }
.made .empty { color: var(--dim); }
.made .cards { flex-wrap: wrap; overflow: visible; }

/* Results */
.result > p { max-width: 64ch; margin-bottom: 14px; }
.cards { display: flex; gap: 12px; overflow-x: auto; padding: 2px 2px 8px; scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
.card { flex: none; width: 188px; text-align: left; display: grid; gap: 10px; align-content: start; padding: 8px; border-radius: 14px; transition: background .15s; }
.card:hover { background: var(--panel); }
.card .th9 { aspect-ratio: 9 / 16; border-radius: 10px; background: var(--raise) center / cover; position: relative; overflow: hidden; }
.card .th9::after { content: 'Play'; position: absolute; inset: auto 8px 8px auto; background: rgba(0,0,0,.65); font-size: 12px; font-weight: 500; padding: 3px 10px; border-radius: 999px; }
.card .tag { position: absolute; left: 8px; top: 8px; }
.card b { font-weight: 600; line-height: 1.3; }
.card small { color: var(--dim); font-size: 12.5px; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.tag { display: inline-block; font-size: 11.5px; font-weight: 600; padding: 3px 9px; border-radius: 999px; background: var(--c); color: #000; }
details.skipped { margin-top: 10px; color: var(--dim); }
details.skipped summary { cursor: pointer; width: fit-content; }
details.skipped summary:hover { color: var(--ink); }
details.skipped ul { padding: 8px 0 0 18px; display: grid; gap: 6px; }
details.skipped b { color: var(--ink); font-weight: 500; }

/* Empty state: the persona gallery */
.hero { flex: 1; min-height: 0; overflow-y: auto; padding: 16px 24px; scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
.hero-in { max-width: 780px; min-height: 100%; margin: 0 auto; display: flex; flex-direction: column; justify-content: center; gap: 12px; text-align: center; }
.hero h1 { font: 800 clamp(32px, 4.6vw, 56px)/1 var(--display); letter-spacing: -.03em; }
.hero p { color: var(--dim); max-width: 44ch; margin: 0 auto; }
#heroSlot { margin-top: 18px; text-align: left; }
#heroSlot .composer { box-shadow: 0 0 0 1px var(--line), 0 24px 80px -30px rgba(61,107,255,.45); }
#heroSlot .suggest { margin-top: 14px; }
.others { justify-self: center; align-self: center; display: inline-flex; align-items: center; gap: 7px; margin-top: 2px; color: var(--dim); font-size: 13px; font-weight: 500; padding: 6px 12px; border-radius: 999px; }
.others:hover { color: var(--ink); background: var(--panel); }
.others svg { width: 14px; height: 14px; stroke: currentColor; stroke-width: 1.8; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.gallery.dealing .pboard { animation: deal .5s cubic-bezier(.2,1.2,.4,1) both; animation-delay: calc(var(--i) * 70ms); }
@keyframes deal { from { opacity: 0; transform: translateY(14px) scale(.96); } }
/* A preset as a reel: one short video, a caption like a real post, and it plays while hovered */
.reel { position: relative; isolation: isolate; display: block; width: 100%; aspect-ratio: 9 / 16; border-radius: 18px; overflow: hidden; background: #0b0c0f center / cover;
  text-align: left; color: #fff; box-shadow: 0 0 0 1px var(--line); transition: transform .25s cubic-bezier(.2,.8,.2,1), box-shadow .25s; }
.reel { transition: transform .35s cubic-bezier(.2,.8,.2,1), box-shadow .35s, opacity .35s, filter .35s; }
.reel.playing, .reel:focus-visible { transform: translateY(-6px) scale(1.035); box-shadow: 0 0 0 2px var(--pc), 0 34px 70px -24px var(--pc); outline: none; z-index: 1; }
.gallery:has(.reel.playing) .reel:not(.playing) { opacity: .45; filter: saturate(.35) brightness(.8); transform: scale(.97); } /* the one you hover takes the stage */
.rbar { position: absolute; left: 10px; right: 10px; top: 8px; height: 3px; border-radius: 2px; background: rgba(255,255,255,.28); overflow: hidden; opacity: 0; transition: opacity .3s; }
.rbar::after { content: ''; position: absolute; inset: 0; background: #fff; transform-origin: left; transform: scaleX(var(--prog, 0)); transition: transform .3s linear; }
.reel.playing .rbar { opacity: 1; }
.rcap, .rside { transition: transform .35s cubic-bezier(.2,.8,.2,1); }
.reel.playing .rcap, .reel.playing .rside { transform: translateY(-4px); }
.reel .vid { position: absolute; inset: 0; z-index: -2; overflow: hidden; }
/* The video is never transparent (browsers pause muted video they think is invisible): its still frame covers it instead,
   and fades away to reveal it */
.reel .cover { position: absolute; inset: 0; z-index: -1; background: inherit; transition: opacity .25s; }
.reel .vid.on + .cover { opacity: 0; }
.reel .vid iframe { position: absolute; left: -20%; top: -16%; width: 140%; height: 140%; border: 0; pointer-events: none; } /* rendered larger (sharper) and cropped: a sliver off the top keeps heads in frame while hiding YouTube's header; the rest comes off the sides and bottom, where YouTube's buttons and channel name sit */
.reel::after { content: ''; position: absolute; inset: 0; z-index: -1; background: linear-gradient(rgba(0,0,0,.25), transparent 22%, transparent 55%, rgba(0,0,0,.8)); }
.rside { position: absolute; right: 8px; bottom: 74px; display: grid; gap: 12px; justify-items: center; }
.rside .rav { width: 30px; height: 30px; border-radius: 50%; background: var(--pc); color: #000; display: grid; place-items: center; font: 800 11px/1 var(--display); box-shadow: 0 0 0 2px #fff; margin-bottom: 4px; }
.rside svg { width: 22px; height: 22px; fill: #fff; filter: drop-shadow(0 1px 3px rgba(0,0,0,.5)); }
.rcap { position: absolute; left: 12px; right: 46px; bottom: 12px; display: grid; gap: 4px; text-shadow: 0 1px 3px rgba(0,0,0,.6); }

<script>

const initials = (n) => {
  const w = (n || '?').replace(/\(.*\)/, '').trim().split(/\s+/);

// POST that streams server-sent events back.
async function stream(url, body, on) {
  const r = await fetch(url, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) });
  if (!r.ok) { const b = await r.json().catch(() => ({})); throw new Error(b.error || r.statusText); }
  const reader = r.body.pipeThrough(new TextDecoderStream()).getReader();

// Only 4 personas at a time, dealt at random; the one in use always stays in view. "Show others" deals a new set.
const SHOWN = 4;
let dealt = [];
function deal() {
  if (personas.length <= SHOWN) return (dealt = [...personas].sort((a, b) => (b.starter - a.starter) || a.created - b.created).map((p) => p.id));
  const rest = personas.filter((p) => p.id !== persona?.id && !dealt.includes(p.id));
  const fresh = rest.length >= SHOWN - 1 ? rest : personas.filter((p) => p.id !== persona?.id); // ran out: start over
  dealt = [persona?.id, ...[...fresh].sort(() => Math.random() - 0.5).map((p) => p.id)].filter(Boolean).slice(0, SHOWN);
}

  $('#others').hidden = personas.length <= SHOWN;
  $('#gallery').classList.toggle('dealing', animate && !still);

// ---------- reel players: loaded with the page, so hovering plays instantly ----------
// Each preset's video loads muted and keeps playing, hidden behind its poster. Hovering just reveals it (instant, and no
// play command, which would make YouTube flash its buttons); leaving hides it. Opening a thread pauses them all.
const players = new Map(); // tile's persona id -> { fr, box, v, ready, want, playing }
const yt = (pl, func, args = []) => pl.fr.contentWindow?.postMessage(JSON.stringify({ event: 'command', func, args }), '*');
function loadReels() {
  for (const pl of players.values()) pl.fr.remove();
  players.clear();
  if (still) return;
  for (const tile of document.querySelectorAll('#gallery .reel')) {
    const v = personaById(tile.dataset.p)?.video;
    if (!v) continue;
    const box = tile.querySelector('.vid');
    // no YouTube looping: the tile loops the clip itself (below), so YouTube never shows its end or replay screens
    const q = new URLSearchParams({ autoplay: 1, mute: 1, controls: 0, playsinline: 1, modestbranding: 1, rel: 0,
      iv_load_policy: 3, disablekb: 1, fs: 0, start: v.start || 0, enablejsapi: 1, origin: location.origin });

    fr.src = `https://www.youtube-nocookie.com/embed/${v.id}?${q}`; fr.allow = 'autoplay; encrypted-media'; fr.tabIndex = -1; fr.title = '';
    const pl = { fr, box, tile, v, ready: false, want: false, playing: false, heard: false };
    players.set(tile.dataset.p, pl);
    // Ask for player updates until YouTube answers: asked too early, the request is lost and nothing ever plays.
    const ask = () => { if (!pl.heard && players.get(tile.dataset.p) === pl) { fr.contentWindow?.postMessage(JSON.stringify({ event: 'listening', id: v.id, channel: 'widget' }), '*'); setTimeout(ask, 300); } };

addEventListener('message', (e) => {
  let host; try { host = new URL(e.origin).hostname; } catch { return; }
  if (!/(^|\.)youtube(-nocookie)?\.com$/.test(host)) return;
  let d; try { d = JSON.parse(e.data); } catch { return; }
  const pl = [...players.values()].find((x) => x.fr.contentWindow === e.source);
  if (!pl) return;
  pl.heard = true;
  const info = d.info || {};
  if (info.currentTime != null) {
    if (info.duration) pl.dur = info.duration;
    const from = pl.v.start || 0, to = pl.v.end || (pl.dur ? pl.dur - 0.4 : 0);
    // play just the clip: jump to its start (some players ignore the start setting) and back again just before its end,
    // so YouTube never reaches its own end screen or replay button
    if ((info.currentTime < from - 0.5 || (to && info.currentTime >= to - 0.3)) && !(Date.now() - (pl.jumped || 0) < 1500)) {
      // jumping makes YouTube flash its play icon: cover the video with its still frame until that has faded
      pl.jumped = Date.now(); yt(pl, 'seekTo', [from, true]);
      pl.box.classList.remove('on'); pl.calm = false; clearTimeout(pl.t);
      pl.t = setTimeout(() => { pl.t = 0; pl.calm = true; if (pl.want && pl.playing) pl.box.classList.add('on'); }, 1500);
    }
    if (to) pl.tile.style.setProperty('--prog', Math.min(1, Math.max(0, (info.currentTime - from) / (to - from))));
  }
  if (![0, 1, 2, 3].includes(info.playerState)) return;
  const st = info.playerState;
  if (st === 1) pl.ready = true;
  pl.playing = st === 1;
  if (st === 3) return; // a brief buffer, e.g. after jumping back to the clip's start: keep showing what's there
  if (st !== 1) { pl.box.classList.remove('on'); clearTimeout(pl.t); pl.t = 0; pl.calm = false; return; } // the poster covers YouTube's buttons
  // after a loop or a stall YouTube briefly shows its controls: wait for them to fade before revealing again
  if (!pl.calm && !pl.t) pl.t = setTimeout(() => { pl.t = 0; pl.calm = true; if (pl.want && pl.playing) pl.box.classList.add('on'); }, 1500);
  else if (pl.calm && pl.want) pl.box.classList.add('on');
});
function playReel(tile) {

  pl.want = true;
  if (pl.playing && pl.calm) pl.box.classList.add('on');

}
function stopReel(tile) {

    const s = Math.max(cols / w, rows / h);
    c.drawImage(im, (cols - w * s) / 2, 0, w * s, h * s);
    px = c.getImageData(0, 0, cols, rows).data;
  }
  function frame(t) {
    if (!on) return;
    raf = requestAnimationFrame(frame);
    if (!W) return size();
    t = t / 1000 + seed; reveal += (revealTo - reveal) * 0.045;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, W, H);
    const bx = W * (0.5 + 0.32 * Math.sin(t * 0.37)), by = H * (0.45 + 0.3 * Math.cos(t * 0.29));
    const cx = W * (0.5 + 0.3 * Math.cos(t * 0.23 + 2)), cy = H * (0.55 + 0.28 * Math.sin(t * 0.31 + 1));
    const R = Math.max(W, H) * 0.2;
    for (let j = 0; j < rows; j++) for (let i = 0; i < cols; i++) {
      const x = i * gap, y = j * gap, k = j * cols + i;
      const glow = Math.exp(-((x - bx) ** 2 + (y - by) ** 2) / (R * R)) + 0.6 * Math.exp(-((x - cx) ** 2 + (y - cy) ** 2) / (R * R * 0.6));
      const tw = 0.5 + 0.5 * Math.sin(t * 2 + rand[k] * 20);
      let r = tint[0], g = tint[1], b = tint[2], a = 0.07 + glow * (0.55 + 0.35 * tw), rad = gap * (0.09 + glow * 0.07);
      if (px) {
        const o = Math.min(1, Math.max(0, (reveal * 1.25 - rand[k]) * 4)), p = k * 4, lum = (px[p] + px[p + 1] + px[p + 2]) / 765;
        r += (px[p] - r) * o; g += (px[p + 1] - g) * o; b += (px[p + 2] - b) * o;
        a += (0.35 + lum * 0.65 - a) * o; rad += (gap * (0.16 + lum * 0.14) - rad) * o;
      }
      ctx.fillStyle = `rgba(${r | 0},${g | 0},${b | 0},${a})`;
      ctx.beginPath(); ctx.arc(x, y, rad, 0, 6.283); ctx.fill();
    }
  }
  new ResizeObserver(size).observe(canvas);
  return {
    image(src) { return new Promise((done) => { img = src; size(); reveal = 0; revealTo = 1; setTimeout(done, still ? 0 : 1100); }); },
    clear() { img = null; px = null; reveal = revealTo = 0; },
    start() { if (!on) { on = true; raf = requestAnimationFrame(frame); } },
    stop() { on = false; cancelAnimationFrame(raf); },
  };
}

// ---------- reel renderer: draws a template as a playable 9:16 video ----------
const RW = 720, RH = 1280;
function timeline(t) {
  const n = t.beats.length, d = t.duration_s || 15;
  let spans = t.beats.map((b) => (String(b.t).match(/([\d.]+)\s*[-–]\s*([\d.]+)/) || []).slice(1).map(Number));
  if (spans.some((s) => s.length < 2 || !(s[1] > s[0]))) spans = t.beats.map((_, i) => [(i * d) / n, ((i + 1) * d) / n]);
  return { spans, total: Math.max(d, spans[spans.length - 1][1]) };
}
function wrap(ctx, text, max) {
  const lines = []; let line = '';
  for (const w of String(text).split(/\s+/)) {
    const test = line ? line + ' ' + w : w;
    if (ctx.measureText(test).width > max && line) { lines.push(line); line = w; } else line = test;
  }
  if (line) lines.push(line);
  return lines;
}
const easeBack = (x) => 1 + 2.2 * (x - 1) ** 3 + 1.2 * (x - 1) ** 2;
function rrect(ctx, x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); ctx.fill(); }

function drawReel(ctx, t, imgs, time, directions, handle = '@yourhandle') {
  const { spans, total } = timeline(t), c = COLOR[t.momentum] || COLOR.rising;
  time = Math.min(time, total - 0.001);
  const bi = Math.max(0, spans.findIndex(([a, b]) => time >= a && time < b)), [a, b] = spans[bi], beat = t.beats[bi];
  const local = time - a, k = local / (b - a);
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, RW, RH);
  // footage: the reference video's frame with a slow push-in and a punch on every cut
  const im = imgs.length ? imgs[bi % imgs.length] : null;
  ctx.save();
  if (im) {
    const punch = Math.max(0, 1 - local / 0.25) * 0.08, s = Math.max(RW / im.width, RH / im.height) * (1.04 + 0.08 * k + punch);
    const dx = (bi % 2 ? -1 : 1) * 24 * k;
    ctx.drawImage(im, (RW - im.width * s) / 2 + dx, (RH - im.height * s) / 2, im.width * s, im.height * s);
  } else {
    const g = ctx.createLinearGradient(0, 0, RW, RH); g.addColorStop(0, c); g.addColorStop(1, '#000');
    ctx.fillStyle = g; ctx.fillRect(0, 0, RW, RH);
  }
  ctx.restore();
  let g = ctx.createLinearGradient(0, RH * 0.55, 0, RH); g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,.85)');
  ctx.fillStyle = 'rgba(0,0,0,.18)'; ctx.fillRect(0, 0, RW, RH); ctx.fillStyle = g; ctx.fillRect(0, 0, RW, RH);
  const flash = Math.max(0, 1 - local / 0.12);
  if (flash && time > 0.05) { ctx.fillStyle = `rgba(255,255,255,${flash * 0.5})`; ctx.fillRect(0, 0, RW, RH); }

  // progress segments, like stories
  const gapW = 8, segW = (RW - 48 - gapW * (spans.length - 1)) / spans.length;
  spans.forEach(([s0, s1], i) => {
    const f = Math.min(1, Math.max(0, (time - s0) / (s1 - s0)));
    ctx.fillStyle = 'rgba(255,255,255,.3)'; rrect(ctx, 24 + i * (segW + gapW), 28, segW, 5, 3);
    if (f) { ctx.fillStyle = '#fff'; rrect(ctx, 24 + i * (segW + gapW), 28, segW * f, 5, 3); }
  });

  // on-screen text, in the classic white-box style, popping in on each beat
  const text = beat.text || (bi === 0 ? t.hook : '');
  if (text) {
    const p = Math.min(1, local / 0.28), sc = 0.82 + 0.18 * easeBack(p);
    ctx.save(); ctx.translate(RW / 2, RH * 0.36); ctx.scale(sc, sc); ctx.globalAlpha = Math.min(1, p * 2);
    ctx.font = '800 54px "Bricolage Grotesque"'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    const lines = wrap(ctx, text, RW - 150), lh = 70, top = -((lines.length - 1) * lh) / 2;
    lines.forEach((l, i) => { const w = ctx.measureText(l).width + 36; ctx.fillStyle = '#fff'; rrect(ctx, -w / 2, top + i * lh - 34, w, 66, 12); });
    ctx.fillStyle = '#000'; lines.forEach((l, i) => ctx.fillText(l, 0, top + i * lh + 2));
    ctx.restore();
  }

  // shooting direction for the creator
  let y = RH - 250;
  if (directions) {
    ctx.font = '500 25px Geist'; ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
    const lines = wrap(ctx, beat.shot, RW - 120).slice(0, 3), h = 58 + lines.length * 33;
    y = RH - 250 - h - 18;
    ctx.fillStyle = 'rgba(0,0,0,.6)'; rrect(ctx, 24, y, RW - 48, h, 18);
    ctx.fillStyle = c; ctx.font = '600 21px Geist'; ctx.fillText(`Shot ${bi + 1} of ${spans.length}  ·  ${beat.t}`, 48, y + 40);
    ctx.fillStyle = '#fff'; ctx.font = '500 25px Geist'; lines.forEach((l, i) => ctx.fillText(l, 48, y + 76 + i * 33));
  }

  // the post itself: handle, caption, sound
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic'; ctx.fillStyle = '#fff'; ctx.font = '600 28px Geist'; ctx.fillText(handle, 32, RH - 190);
  ctx.font = '400 25px Geist';
  wrap(ctx, t.caption, RW - 140).slice(0, 2).forEach((l, i) => ctx.fillText(l, 32, RH - 148 + i * 33));
  ctx.fillStyle = '#9fb4ff'; ctx.fillText(t.hashtags.slice(0, 4).join(' '), 32, RH - 76);
  ctx.fillStyle = 'rgba(255,255,255,.8)'; ctx.font = '500 22px Geist';
  ctx.fillText('♪ ' + wrap(ctx, t.audio, RW - 120)[0], 32, RH - 36);
  return { bi, k, total };
}

// ---------- studio ----------
const reelCtx = $('#reel').getContext('2d');
let templates = [], cur = -1, imgsBy = new Map(), developed = new WeakSet();
const handle = () => (account?.name?.startsWith('@') ? account.name : '@yourhandle');
function loadImgs(t) {
  const ids = (t.references || []).filter((id) => /^[\w-]{11}$/.test(id));
  return Promise.all(ids.map((id) => new Promise((r) => { const im = new Image(); im.onload = () => r(im); im.onerror = () => r(null); im.src = '/api/thumb?id=' + id; })))
    .then((list) => list.filter(Boolean));
}
const player = (() => {
  let raf, playing = false, t0 = 0, at = 0, total = 1, tpl = null, imgs = [];
  const loop = (now) => {
    if (playing) at = (now - t0) / 1000;
    if (at >= total) { at = 0; t0 = now; }
    sync(drawReel(reelCtx, tpl, imgs, at, $('#dir').checked, handle()));
    raf = requestAnimationFrame(loop);
  };
  return {
    load(t, im) { tpl = t; imgs = im; total = timeline(t).total; at = 0; t0 = performance.now(); cancelAnimationFrame(raf); raf = requestAnimationFrame(loop); },
    play(p = !playing) { playing = p; t0 = performance.now() - at * 1000; icon(); },
    seek(s) { at = s; t0 = performance.now() - s * 1000; },
    stop() { cancelAnimationFrame(raf); playing = false; },
    get playing() { return playing; },
  };
})();
function icon() {
  $('#playIcon').innerHTML = player.playing ? '<rect x="2" y="1" width="3.5" height="12" rx="1"/><rect x="8.5" y="1" width="3.5" height="12" rx="1"/>' : '<path d="M3 1.5v11l9.5-5.5z"/>';
  $('#play').setAttribute('aria-label', player.playing ? 'Pause' : 'Play');
}
let lastBeat = -1;
function sync({ bi, k }) {
  const segs = $('#segs').children;
  for (let i = 0; i < segs.length; i++) segs[i].style.setProperty('--p', (i < bi ? 100 : i === bi ? k * 100 : 0) + '%');
  if (bi !== lastBeat) { lastBeat = bi; document.querySelectorAll('.beats li').forEach((li, i) => li.classList.toggle('on', i === bi)); }
}

// The browser's view transitions animate between views; the template card grows into the phone and back.
const vt = (fn) => {
  if (still || !document.startViewTransition || document.hidden) return Promise.resolve(fn());
  const t = document.startViewTransition(fn);
  t.ready.catch(() => {}); // a skipped transition still runs fn; only the animation is lost
  return t.finished.catch(() => {});
};
let studioFrom = null; // { view: 'chat' | 'profile', sel: the card the studio was opened from }
function view(name) {
  $('#chat').hidden = name !== 'chat'; $('#profile').hidden = name !== 'profile'; $('#studio').hidden = name !== 'studio';
  $('#back').hidden = name === 'chat';
  $('#back').textContent = name === 'studio' ? (studioFrom?.view === 'profile' ? 'Back to profile' : 'Back to thread') : 'Back';
  $('#del').hidden = name !== 'chat' || !thread || !!thread.sample;
}
// Opens the studio from a template card, growing that card's thumbnail into the phone.
function playFrom(card, list, i, from) {
  const th = card.querySelector('.th9');
  studioFrom = { view: from, sel: card.dataset.sel };
  th.style.viewTransitionName = 'reel';
  vt(() => { th.style.viewTransitionName = ''; openStudio(list, i); });
}
function openStudio(list, i) {
  templates = list; imgsBy = new Map(); cur = -1;
  $('#railTitle').textContent = `${list.length} for ${persona?.name || 'this arche'}`;
  $('#list').innerHTML = templates.map((t, j) => `<li><button class="item" style="--c:${COLOR[t.momentum]}" data-i="${j}">
    <span class="t9"${thumb(t)}></span><span><b>${esc(t.title)}</b><small>${esc(label(t))}</small></span></button></li>`).join('');
  reelCtx.fillStyle = '#000'; reelCtx.fillRect(0, 0, RW, RH); // no stale frame from the last template during the transition
  view('studio'); $('#studio').scrollTop = 0;
  select(i);
}
function closeStudio(animate = false) {
  if ($('#studio').hidden) return;
  const from = studioFrom?.view || 'chat', at = cur;
  const leave = () => { player.stop(); develop.stop(); cur = -1; view(from); };
  if (!animate) return leave();
  // Shrink the phone back into the card of whichever template is showing now.
  const sel = studioFrom?.sel?.replace(/data-i="\d+"/, `data-i="${at}"`);
  vt(() => { leave(); const th = sel && document.querySelector(sel + ' .th9'); if (th) { th.style.viewTransitionName = 'reel'; th.scrollIntoView({ block: 'nearest' }); } })
    .then(() => document.querySelectorAll('.th9').forEach((t) => (t.style.viewTransitionName = '')));
}
$('#list').onclick = (e) => { const b = e.target.closest('.item'); if (b) select(+b.dataset.i); };

const develop = dotField($('#develop'), { gap: 9 });
async function select(i) {
  if (i === cur || !templates[i]) return;
  cur = i; const t = templates[i], c = COLOR[t.momentum];
  document.querySelectorAll('.item').forEach((b) => b.setAttribute('aria-current', String(+b.dataset.i === i)));
  const { spans } = timeline(t);
  $('#segs').innerHTML = spans.map(([a, b], j) => `<button style="--w:${b - a}" data-s="${a}" aria-label="Jump to shot ${j + 1}"><span></span></button>`).join('');
  $('#details').style.setProperty('--c', c);
  $('#details').innerHTML = `<span class="tag">${esc(label(t))}</span>
    <h1>${esc(t.title)}</h1><p class="why">${esc(t.trend)}</p>
    ${t.fit ? `<section><h3>Why it fits ${esc(persona?.name || 'this arche')}</h3><p class="fitbox">${esc(t.fit)}</p></section>` : ''}
    <section><h3>Shot list · ${t.duration_s}s, ${esc(t.format)}</h3><ol class="beats">${t.beats.map((b, j) => `<li><button data-s="${spans[j][0]}">
      <span class="t">${esc(b.t)}</span><span>${esc(b.shot)}${b.text ? `<br><span class="ost">${esc(b.text)}</span>` : ''}</span></button></li>`).join('')}</ol></section>
    <section><h3>Caption</h3><div class="cap">${esc(t.caption)}<div class="h">${esc(t.hashtags.join(' '))}</div></div></section>
    <section><h3>Sound</h3><p>${esc(t.audio)}</p></section>
    ${t.references?.length ? `<section><h3>Based on these videos</h3><div class="refs">${t.references.map((id) => `<a href="https://www.youtube.com/watch?v=${esc(id)}" target="_blank" rel="noopener" aria-label="Watch reference video on YouTube" style="background-image:url('/api/thumb?id=${esc(id)}')"></a>`).join('')}</div></section>` : ''}
    <div class="actions"><button class="primary" id="export">Export video</button><button class="quiet" id="copy">Copy shot list</button><button class="quiet" id="json">Download .json</button></div>`;
  lastBeat = -1;
  if (!imgsBy.has(t)) imgsBy.set(t, loadImgs(t));
  const [imgs] = await Promise.all([imgsBy.get(t), document.fonts.load('800 54px "Bricolage Grotesque"'), document.fonts.load('500 25px Geist')]);
  if (cur !== i) return;
  player.load(t, imgs);
  if (developed.has(t) || still) { $('#develop').classList.add('gone'); $('#making').classList.add('gone'); player.play(true); return; }
  // first view: the video develops out of the dot grid, like an image being generated
  developed.add(t); player.play(false); player.seek(0.6);
  develop.clear(); develop.start(); $('#develop').classList.remove('gone'); $('#making').classList.remove('gone');
  await wait(900);
  const frame = document.createElement('canvas'); frame.width = RW; frame.height = RH;
  drawReel(frame.getContext('2d'), t, imgs, 0.6, false, handle());
  await develop.image(frame);
  if (cur !== i) return;
  $('#develop').classList.add('gone'); $('#making').classList.add('gone');
  await wait(500); develop.stop(); player.seek(0); player.play(true);
}

$('#studio').addEventListener('click', (e) => {
  const s = e.target.closest('[data-s]'); if (s) { player.seek(+s.dataset.s + 0.001); return; }
  if (e.target.id === 'copy') navigator.clipboard.writeText(shotList(templates[cur])).then(() => toast('Shot list copied'));
  if (e.target.id === 'json') download(new Blob([JSON.stringify(templates[cur], null, 2)], { type: 'application/json' }), slug(templates[cur]) + '.json', 'Template downloaded');
  if (e.target.id === 'export') exportVideo(e.target);
});
$('#phone').onclick = () => player.play();
$('#play').onclick = () => player.play();
const slug = (t) => t.title.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'template';
function download(blob, name, msg) { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 5000); toast(msg); }
function shotList(t) {
  return `${t.title} (${t.format}, ${t.duration_s}s)\nSound: ${t.audio}\n\n` +
    t.beats.map((b) => `${b.t}  ${b.shot}${b.text ? `\n       On screen: "${b.text}"` : ''}`).join('\n') + `\n\nCaption: ${t.caption}\n${t.hashtags.join(' ')}`;
}
// Records the reel in real time from an offscreen canvas. mp4 where the browser can, webm otherwise.
async function exportVideo(btn) {
  const t = templates[cur], imgs = await imgsBy.get(t), { total } = timeline(t), dir = $('#dir').checked, h = handle();
  const cv = document.createElement('canvas'); cv.width = RW; cv.height = RH;
  const ctx = cv.getContext('2d');
  const type = ['video/mp4;codecs=avc1.42E01E', 'video/mp4', 'video/webm;codecs=vp9', 'video/webm'].find((m) => MediaRecorder.isTypeSupported(m));
  const rec = new MediaRecorder(cv.captureStream(30), { mimeType: type, videoBitsPerSecond: 6e6 });
  const chunks = []; rec.ondataavailable = (e) => e.data.size && chunks.push(e.data);
  btn.disabled = true;
  const done = new Promise((r) => (rec.onstop = r));
  drawReel(ctx, t, imgs, 0, dir, h); rec.start();
  const t0 = performance.now();
  await new Promise((r) => {
    (function f() {
      const s = (performance.now() - t0) / 1000;
      drawReel(ctx, t, imgs, Math.min(s, total - 0.01), dir, h);
      btn.textContent = `Exporting ${Math.min(99, Math.round((s / total) * 100))}%`;
      if (s < total) requestAnimationFrame(f); else r();
    })();
  });
  rec.stop(); await done;
  btn.disabled = false; btn.textContent = 'Export video';
  download(new Blob(chunks, { type }), slug(t) + (type.includes('mp4') ? '.mp4' : '.webm'), 'Video exported');
}

// ---------- wiring ----------
$('#threads').onclick = (e) => { const b = e.target.closest('.th'); if (b) openThread(b.dataset.id).catch((err) => toast(err.message)); };
$('#newThread').onclick = newThread;
$('#home').onclick = newThread;
$('#back').onclick = () => (!$('#studio').hidden ? closeStudio(true) : closeProfile());
$('#menu').onclick = (e) => { e.stopPropagation(); $('#side').classList.toggle('open'); };
$('#side').onclick = (e) => e.stopPropagation();
document.addEventListener('click', () => $('#side').classList.remove('open'));
$('#del').onclick = async () => {
  if (!thread || !confirm(`Delete "${thread.title}"? This can't be undone.`)) return;
  await api('/api/threads/' + encodeURIComponent(thread.id), { method: 'DELETE' });
  await refresh(); newThread();
};
addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && !$('#dlg').open && !$('#adlg').open) { if (!$('#studio').hidden) return closeStudio(true); if (!$('#profile').hidden) return closeProfile(); }
  if ($('#studio').hidden || e.target.matches('input, select, textarea')) return;
  if (e.code === 'Space') { e.preventDefault(); player.play(); }
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); select(cur + (e.key === 'ArrowDown' ? 1 : -1)); }
});
icon();
refresh().then(newThread).catch((e) => toast(e.message));
</script>
</body>
