app = "arche-demo"
primary_region = "sin"

[build]

[http_service]
  internal_port = 8080
  force_https = true
  # One always-on machine: agent turns stream over SSE and keep Chrome sessions in memory.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[mounts]]
  source = "arche_data"
  destination = "/data"
  initial_size = "1gb"

[[vm]]
  size = "shared-cpu-2x"
  memory = "2gb"
